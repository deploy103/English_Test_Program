services:
  english-test-program:
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: "8003"
      WORD_TEST_DATA_DIR: /app/data
      APP_ORIGIN: ${APP_ORIGIN:-}
      APP_ORIGINS: ${APP_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
    expose:
      - "8003"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8003/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mvtp-web-net

networks:
  mvtp-web-net:
    external: true
